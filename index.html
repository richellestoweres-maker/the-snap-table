<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The SNAP Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FBF6EE; --card:#FFFFFF; --ink:#2B2522; --soft:#6E625A; --line:#EADFD0;
  --tomato:#C8553D; --tomato-d:#A9432E; --green:#2F5D50; --green-l:#E3EFE9;
  --mustard:#E9B44C; --mustard-l:#FBF0D6; --red-l:#F8E1DA;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#EFE6D8;font-family:Nunito,system-ui,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--cream);position:relative;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header{padding:calc(18px + env(safe-area-inset-top)) 20px 8px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:10px}
.logo svg{width:38px;height:38px}
.logo b{font-family:Fraunces,serif;font-size:22px;letter-spacing:.2px}
.logo b span{color:var(--tomato)}
main{padding:6px 18px 20px}
h1{font-family:Fraunces,serif;font-size:28px;line-height:1.15;margin:8px 0 4px}
h2{font-family:Fraunces,serif;font-size:20px;margin:22px 0 10px}
.sub{color:var(--soft);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 8px rgba(80,50,20,.05)}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.label{font-weight:800;font-size:15px}
.hint{color:var(--soft);font-size:13px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:12px;background:var(--green-l);color:var(--green);font-size:22px;font-weight:800}
.stepper span{min-width:30px;text-align:center;font-weight:800;font-size:20px}
.money{display:flex;align-items:center;background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:0 10px;height:44px;width:130px}
.money input{border:0;background:none;outline:none;width:100%;font-weight:800;font-size:18px;padding-left:4px}
select{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--cream);padding:0 10px;font-weight:700}
.big{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border-radius:18px;padding:18px;margin:12px 0;color:#fff}
.big.t{background:var(--tomato)} .big.g{background:var(--green)}
.big .ic{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:26px;flex:none}
.big b{display:block;font-size:18px} .big small{opacity:.9;font-size:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.stat b{font-family:Fraunces,serif;font-size:30px;color:var(--green);display:block}
.stat span{font-size:13px;color:var(--soft);font-weight:700}
.search{width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:#fff;padding:0 14px;font-size:16px;outline:none;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:15px}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.chip.on::before{content:"✓ "}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px;margin:12px 0}
.seg button{flex:1;padding:10px 4px;border-radius:10px;font-weight:800;font-size:14px;color:var(--soft)}
.seg button.on{background:var(--tomato);color:#fff}
.meal{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}
.plate{width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:28px;background:var(--mustard-l);border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.meal b{font-size:17px;display:block;margin-bottom:3px}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px;margin-right:6px;margin-top:4px}
.tag.ready{background:var(--green-l);color:var(--green)}
.tag.close{background:var(--mustard-l);color:#8A6212}
.tag.trip{background:var(--red-l);color:var(--tomato-d)}
.tag.cost{background:var(--cream);color:var(--ink)}
.price{margin-left:auto;text-align:right;flex:none}
.price b{font-family:Fraunces,serif;font-size:20px;color:var(--green)}
.price span{display:block;font-size:12px;color:var(--soft);font-weight:700}
.empty{text-align:center;padding:30px 10px;color:var(--soft)}
.empty b{display:block;font-family:Fraunces,serif;color:var(--ink);font-size:20px;margin-bottom:6px}
.btn{display:block;width:100%;height:52px;border-radius:14px;font-weight:800;font-size:16px;margin-top:12px}
.btn.t{background:var(--tomato);color:#fff} .btn.g{background:var(--green);color:#fff}
.btn.o{background:#fff;border:1.5px solid var(--line)}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:var(--green);padding:6px 0}
.ing{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.ing:last-child{border-bottom:0}
.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:800;flex:none}
.dot.have{background:var(--green-l);color:var(--green)}
.dot.need{background:var(--red-l);color:var(--tomato-d)}
.dot.basic{background:var(--cream);color:var(--soft)}
.ing .nm{flex:1;font-weight:700}
.ing .nm small{display:block;font-weight:600;color:var(--soft);font-size:13px}
.ing .pr{font-weight:800}
ol.steps{padding-left:22px}
ol.steps li{margin:10px 0;line-height:1.5}
.compare{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.store{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center}
.store.best{border-color:var(--green);background:var(--green-l)}
.store small{display:block;font-weight:800;font-size:12px;color:var(--soft)}
.store b{font-size:17px}
.store em{display:block;font-style:normal;font-size:11px;font-weight:800;color:var(--green);margin-top:2px}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.box{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:#fff;font-weight:800}
.li.done .box{background:var(--green);border-color:var(--green)}
.li.done .nm{text-decoration:line-through;color:var(--soft)}
.li .nm{flex:1;font-weight:700}
.li .nm small{display:block;font-weight:600;color:var(--soft);font-size:13px}
.budget{border-radius:14px;padding:14px;font-weight:800;margin-top:12px}
.budget.ok{background:var(--green-l);color:var(--green)}
.budget.over{background:var(--red-l);color:var(--tomato-d)}
.link{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit}
.link .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:none;background:var(--mustard-l)}
.link b{display:block;font-size:16px}
.link .go{margin-left:auto;color:var(--soft);font-size:22px}
.note{background:var(--mustard-l);border-radius:16px;padding:14px;font-size:14px;line-height:1.45}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:800;color:var(--soft);padding:4px 0;position:relative}
nav button .i{font-size:22px;line-height:1}
nav button.on{color:var(--tomato)}
nav .badge{position:absolute;top:0;right:calc(50% - 22px);background:var(--tomato);color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:9;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{font-size:12px;color:var(--soft);text-align:center;margin-top:18px}
.meal .desc{display:block;font-size:13px;color:var(--soft);margin-bottom:2px;line-height:1.3}
.ing small.alt{color:var(--green)}
h2 .count{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:11px;background:var(--green);color:#fff;font-family:Nunito,sans-serif;font-size:12px;padding:0 6px;vertical-align:middle}
.big.m{background:var(--mustard);color:var(--ink)}
.big.m .ic{background:rgba(255,255,255,.35)}
.stat.wide{grid-column:1/-1}
nav button{font-size:11px}
.tag.fancy{background:#F1E6F7;color:#6B3F8A}
.seg button{font-size:13px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.scroll .chip{flex:none}
.cuisine{width:100%;margin-top:10px}
.tag.world{background:#E3ECF7;color:#2E4E7A}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#C8553D"/><circle cx="20" cy="20" r="12.5" fill="#FBF6EE"/><circle cx="20" cy="20" r="8" fill="#E9B44C" opacity=".55"/><path d="M27 9v22M25 9v6M29 9v6M25 15h4" stroke="#2F5D50" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
      <b>The <span>SNAP</span> Table</b>
    </div>
  </header>
  <main id="screen"></main>
  <nav id="nav"></nav>
</div>
<div class="toast" id="toast"></div>

<script src="data.js?v=129"></script>
<script>
/* ---------- SETUP ---------- */
const MULT = {aldi:1, kroger:1.3, heb:1.08, walmart:1.05};
const ITEMS = ITEMS_RAW.map(a=>{
  const p = a[4]; const price = {};
  STORES.forEach(s=>{ price[s.id] = s.id==="aldi" ? p : Math.ceil(p*MULT[s.id]*10)/10 - 0.01; });
  return {id:a[0], name:a[1], pkg:a[2], cat:a[3], basic:!!a[5], price};
});
const ITEM = Object.fromEntries(ITEMS.map(i=>[i.id,i]));
const ALLERGY_OF = {};
Object.entries(ALLERGENS).forEach(([a,ids])=>ids.forEach(id=>{ (ALLERGY_OF[id]=ALLERGY_OF[id]||[]).push(a); }));
const ALLERGY_LIST = [["peanut","Peanuts"],["treenut","Tree nuts"],["milk","Milk"],["egg","Eggs"],["wheat","Wheat"],["soy","Soy"],["fish","Fish"],["shellfish","Shellfish"],["sesame","Sesame"]];
const parseIng = s=>s.split(";").map(g=>g.trim()).filter(Boolean)
  .map(g=>g.split("|").map(o=>{ const t=o.trim().split(/\s+/); return {id:t[0], use:parseFloat(t[1]||"0")}; }).filter(o=>ITEM[o.id]))
  .filter(g=>g.length);
RECIPES.forEach(r=>{ r.groups = parseIng(r.ing); });
SCRATCH.forEach(r=>{ r.groups = parseIng(r.ing); });

/* ---------- STATE ---------- */
const KEY = "snaptable.v1";
let S = {tab:"home", pantry:[], family:4, budget:"", store:"aldi", list:{}, done:[], filter:"ready", q:"", meal:null, scratch:null, allergies:[], asked:false, saved:0, mtype:"all", cuisine:"all"};
try{ const saved = JSON.parse(localStorage.getItem(KEY)||"null"); if(saved) Object.assign(S, saved, {meal:null, scratch:null, q:""}); }catch(e){}
S.pantry = S.pantry.filter(id=>ITEM[id]);
Object.keys(S.list).forEach(id=>{ if(!ITEM[id]) delete S.list[id]; });
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({pantry:S.pantry,family:S.family,budget:S.budget,store:S.store,list:S.list,done:S.done,filter:S.filter,tab:S.tab,allergies:S.allergies,asked:S.asked,saved:S.saved,mtype:S.mtype,cuisine:S.cuisine})); }catch(e){} }

/* ---------- HELPERS ---------- */
const $ = s=>document.querySelector(s);
const money = n=>"$"+n.toFixed(2);
const has = id=>S.pantry.includes(id);
const storeName = id=>STORES.find(s=>s.id===id).name;
const k = ()=>S.family/4;
const safe = id=>!(ALLERGY_OF[id]||[]).some(a=>S.allergies.includes(a));
const opts = g=>g.filter(o=>safe(o.id));
const isBasic = g=>ITEM[opts(g)[0].id].basic;
const haveG = g=>opts(g).some(o=>has(o.id));
const pick = g=>opts(g).find(o=>has(o.id))||opts(g)[0];
const okMeal = r=>r.groups.every(g=>opts(g).length);
const mtype = r=>r.type||TYPE_OF[r.id]||"dinner";
const cuisine = r=>r.cuisine||CUISINE_OF[r.id]||"American";
const pkgs = (o,s)=>Math.max(1, Math.ceil(o.use*s-0.001));
function mealInfo(r){
  let cost=0; const need=[];
  r.groups.forEach(g=>{
    if(isBasic(g)) return;
    const o = pick(g);
    cost += ITEM[o.id].price[S.store]*o.use*k();
    if(!haveG(g)) need.push(g);
  });
  const status = need.length===0 ? "ready" : need.length<=2 ? "close" : "trip";
  const buy = need.reduce((t,g)=>t+ITEM[pick(g).id].price[S.store]*pkgs(pick(g),k()),0);
  return {cost, perPlate:cost/S.family, need, status, buy};
}
function scratchInfo(r){
  let cost=0; const need=[];
  r.groups.forEach(g=>{
    const o = pick(g); const it = ITEM[o.id];
    if(it.basic){ cost += 0.05; return; }
    cost += it.price[S.store]*o.use;
    if(!haveG(g)) need.push(g);
  });
  const store = ITEM[r.makes].price[S.store]*(r.yield||1);
  const buy = need.reduce((t,g)=>t+ITEM[pick(g).id].price[S.store]*pkgs(pick(g),1),0);
  return {cost, store, save:Math.max(0,store-cost), need, buy};
}
function ingRows(r,s){
  return r.groups.map(g=>{
    const list = opts(g); const it = ITEM[list[0].id];
    if(it.basic) return `<div class="ing"><span class="dot basic">•</span><span class="nm">${it.name}<small>Basic</small></span></div>`;
    if(haveG(g)){ const o=pick(g); return `<div class="ing"><span class="dot have">✓</span><span class="nm">${ITEM[o.id].name}<small>You have this</small></span></div>`; }
    const n = pkgs(list[0],s);
    const alt = list.slice(1).map(o=>ITEM[o.id].name.toLowerCase()).join(" or ");
    return `<div class="ing"><span class="dot need">+</span><span class="nm">${it.name}<small>${n>1?n+" × ":""}${it.pkg}</small>${alt?`<small class="alt">Or use ${alt}</small>`:""}</span><span class="pr">${money(it.price[S.store]*n)}</span></div>`;
  }).join("");
}
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1800); }
function listCount(){ return Object.keys(S.list).length; }
function go(tab){ S.tab=tab; S.meal=null; S.scratch=null; save(); render(true); }
const allergyNames = ()=>ALLERGY_LIST.filter(([id])=>S.allergies.includes(id)).map(([,l])=>l).join(", ");

/* ---------- SCREENS ---------- */
function Home(){
  const ready = RECIPES.filter(okMeal).map(mealInfo).filter(i=>i.status==="ready").length;
  const hour = new Date().getHours();
  const hi = hour<11 ? "What's for breakfast?" : hour<16 ? "What's for lunch?" : "What's for dinner?";
  const ask = !S.asked ? `
  <div class="card">
    <div class="label">Any food allergies at home?</div>
    <p class="hint" style="margin:4px 0 12px">We'll only show safe meals.</p>
    <div class="chips">${ALLERGY_LIST.map(([id,l])=>`<button class="chip ${S.allergies.includes(id)?"on":""}" data-act="allergy" data-a="${id}">${l}</button>`).join("")}</div>
    <div class="row" style="margin-top:14px;gap:10px"><button class="btn o" style="margin:0" data-act="noallergy">No allergies</button><button class="btn g" style="margin:0" data-act="allergydone">Done</button></div>
    <p class="hint" style="margin-top:10px">Always check labels. Brands differ.</p>
  </div>` : "";
  return `
  <h1>${hi}</h1>
  <p class="sub">Family favorites, made for less.</p>
  ${ask}
  <div class="card">
    <div class="row between"><div class="label">People eating</div>
      <div class="stepper"><button data-act="fam" data-d="-1" aria-label="Fewer">−</button><span>${S.family}</span><button data-act="fam" data-d="1" aria-label="More">+</button></div>
    </div>
    <div class="row between" style="margin-top:14px"><div><div class="label">SNAP left this month</div><div class="hint">Optional</div></div>
      <label class="money">$<input id="budget" inputmode="decimal" placeholder="0.00" value="${S.budget}"></label>
    </div>
    <div class="row between" style="margin-top:14px"><div class="label">Where I shop</div>
      <select id="store">${STORES.map(s=>`<option value="${s.id}" ${s.id===S.store?"selected":""}>${s.name}</option>`).join("")}</select>
    </div>
    ${S.asked?`<div class="row between" style="margin-top:14px"><div><div class="label">Allergies</div><div class="hint">${allergyNames()||"None"}</div></div><button class="chip" data-act="editallergy">Edit</button></div>`:""}
  </div>

  <button class="big t" data-act="goto" data-tab="meals"><span class="ic">🍲</span><span><b>Cook from my pantry</b><small>${ready} meal${ready===1?"":"s"} ready with what you have</small></span></button>
  <button class="big g" data-act="box"><span class="ic">📦</span><span><b>Got a pantry box?</b><small>Add the usual food bank items in one tap</small></span></button>
  <button class="big m" data-act="goto" data-tab="scratch"><span class="ic">🥖</span><span><b>Make it from scratch</b><small>Tortillas, bread, pizza dough and more</small></span></button>

  <div class="stats">
    <div class="stat"><b>${S.pantry.length}</b><span>in my pantry</span></div>
    <div class="stat"><b>${listCount()}</b><span>on my list</span></div>
    ${S.saved>0?`<div class="stat wide"><b>${money(S.saved)}</b><span>saved cooking from scratch</span></div>`:""}
  </div>`;
}

function Pantry(){
  const q = S.q.trim().toLowerCase();
  const groups = CATS.map(cat=>{
    const items = ITEMS.filter(i=>i.cat===cat && (!q || i.name.toLowerCase().includes(q)));
    if(!items.length) return "";
    const n = items.filter(i=>has(i.id)).length;
    return `<h2>${cat}${n?` <span class="count">${n}</span>`:""}</h2>${cat==="Basics"?`<p class="hint" style="margin:-4px 0 10px">Most meals assume you have these.</p>`:""}
      <div class="chips">${items.map(i=>`<button class="chip ${has(i.id)?"on":""}" data-act="toggle" data-id="${i.id}">${i.name}</button>`).join("")}</div>`;
  }).join("");
  return `
  <h1>My pantry</h1>
  <p class="sub">Tap everything you have.</p>
  <input class="search" id="q" placeholder="Search foods" value="${S.q.replace(/"/g,"&quot;")}">
  ${groups || `<div class="empty"><b>No match</b>Try another word.</div>`}
  ${S.pantry.length?`<button class="btn o" data-act="clearpantry" style="margin-top:24px">Clear my pantry</button>`:""}`;
}

function Meals(){
  const okList = RECIPES.filter(okMeal);
  const hidden = RECIPES.length - okList.length;
  let rows = okList.filter(r=>(S.mtype==="all"||mtype(r)===S.mtype)&&(S.cuisine==="all"||cuisine(r)===S.cuisine)).map(r=>({r,i:mealInfo(r)}));
  const counts = {ready:0,close:0};
  rows.forEach(x=>{ if(x.i.status in counts) counts[x.i.status]++; });
  if(S.filter==="fancy") rows = rows.filter(x=>x.r.fancy); else if(S.filter!=="all") rows = rows.filter(x=>x.i.status===S.filter);
  const order = {ready:0,close:1,trip:2};
  rows.sort((a,b)=>order[a.i.status]-order[b.i.status] || a.i.perPlate-b.i.perPlate);
  const tagFor = i=> i.status==="ready" ? `<span class="tag ready">Ready now</span>`
    : i.status==="close" ? `<span class="tag close">Need ${i.need.length}</span>`
    : `<span class="tag trip">Need ${i.need.length}</span>`;
  const empty = S.filter==="ready"
    ? `<div class="empty"><b>Nothing ready yet</b>Add what you have to your pantry, or check meals that need 1 or 2 things.<button class="btn g" data-act="goto" data-tab="pantry">Add to my pantry</button></div>`
    : `<div class="empty"><b>Nothing here yet</b>Try another tab.</div>`;
  return `
  <h1>Meals</h1>
  <p class="sub">For ${S.family}, priced at ${storeName(S.store)}.</p>
  ${hidden?`<p class="hint" style="margin-top:4px">Hiding ${hidden} meal${hidden===1?"":"s"} with ${allergyNames().toLowerCase()}.</p>`:""}
  <div class="chips scroll" style="margin-top:12px">${MEAL_TYPES.map(([id,l])=>'<button class="chip '+(S.mtype===id?"on":"")+'" data-act="mtype" data-t="'+id+'">'+l+'</button>').join("")}</div>
  <select id="cuisine" class="cuisine">${["all",...CUISINES].map(c=>'<option value="'+c+'" '+(S.cuisine===c?"selected":"")+'>'+(c==="all"?"All cuisines":c)+'</option>').join("")}</select>
  <div class="seg">
    <button class="${S.filter==="ready"?"on":""}" data-act="filter" data-f="ready">Ready (${counts.ready})</button>
    <button class="${S.filter==="close"?"on":""}" data-act="filter" data-f="close">Need 1 or 2 (${counts.close})</button>
    <button class="${S.filter==="fancy"?"on":""}" data-act="filter" data-f="fancy">Fancy</button>
    <button class="${S.filter==="all"?"on":""}" data-act="filter" data-f="all">All</button>
  </div>
  ${rows.length ? rows.map(({r,i})=>`
    <button class="meal" data-act="open" data-id="${r.id}">
      <span class="plate">${r.e}</span>
      <span class="mt"><b>${r.name}</b><span class="desc">${r.d}</span>${r.fancy?'<span class="tag fancy">Fancy for less</span>':""}${cuisine(r)!=="American"?'<span class="tag world">'+cuisine(r)+'</span>':""}${tagFor(i)}<span class="tag cost">${r.time} min</span></span>
      <span class="price"><b>${money(i.perPlate)}</b><span>a plate</span></span>
    </button>`).join("") : empty}`;
}

function addButton(need, pickOk){
  if(!need.length) return "";
  const on = need.every(g=>S.list[pick(g).id]);
  return `<button class="btn t" data-act="addlist" ${on?"disabled style='opacity:.6'":""}>${on?"On your list":"Add "+need.length+" to my list"}</button>`;
}

function MealDetail(){
  const r = RECIPES.find(x=>x.id===S.meal); const i = mealInfo(r);
  return `
  <button class="back" data-act="back">‹ Meals</button>
  <div class="row" style="margin-top:6px"><span class="plate" style="width:64px;height:64px;font-size:32px">${r.e}</span>
    <div><h1 style="margin:0">${r.name}</h1><p class="sub">${r.d}</p><p class="hint">Feeds ${S.family} · ${r.time} min</p></div></div>
  <div class="stats" style="margin-top:14px">
    <div class="stat"><b>${money(i.perPlate)}</b><span>a plate</span></div>
    <div class="stat"><b>${i.need.length?money(i.buy):"$0"}</b><span>to buy at ${storeName(S.store)}</span></div>
  </div>
  ${r.tip?`<div class="note" style="margin-top:12px"><b>Money saver:</b> ${r.tip}</div>`:""}
  <h2>What you need</h2>
  <div class="card" style="padding:4px 16px">${ingRows(r,k())}</div>
  ${addButton(i.need)}
  <h2>How to make it</h2>
  <div class="card"><ol class="steps">${r.steps.map(s=>`<li>${s}</li>`).join("")}</ol></div>
  <button class="btn g" data-act="made">I made this</button>`;
}

function Scratch(){
  const rows = SCRATCH.filter(okMeal).map(r=>({r,i:scratchInfo(r)}));
  return `
  <h1>From scratch</h1>
  <p class="sub">Make it yourself for a lot less.</p>
  ${rows.map(({r,i})=>`
    <button class="meal" data-act="sopen" data-id="${r.id}">
      <span class="plate">${r.e}</span>
      <span class="mt"><b>${r.name}</b><span class="desc">${r.d}</span><span class="tag ready">Save ${money(i.save)}</span><span class="tag cost">${r.time} min</span></span>
      <span class="price"><b>${money(i.cost)}</b><span>vs ${money(i.store)}</span></span>
    </button>`).join("")}`;
}

function ScratchDetail(){
  const r = SCRATCH.find(x=>x.id===S.scratch); const i = scratchInfo(r);
  return `
  <button class="back" data-act="back">‹ From scratch</button>
  <div class="row" style="margin-top:6px"><span class="plate" style="width:64px;height:64px;font-size:32px">${r.e}</span>
    <div><h1 style="margin:0">${r.name}</h1><p class="sub">${r.d}</p><p class="hint">Makes ${r.makesText} · ${r.time} min</p></div></div>
  <div class="stats" style="margin-top:14px">
    <div class="stat"><b>${money(i.cost)}</b><span>homemade</span></div>
    <div class="stat"><b>${money(i.store)}</b><span>store bought</span></div>
  </div>
  <div class="budget ok">You save ${money(i.save)} making it yourself.</div>
  ${r.tip?`<div class="note" style="margin-top:12px"><b>Tip:</b> ${r.tip}</div>`:""}
  <h2>What you need</h2>
  <div class="card" style="padding:4px 16px">${ingRows(r,1)}</div>
  ${addButton(i.need)}
  <h2>How to make it</h2>
  <div class="card"><ol class="steps">${r.steps.map(s=>`<li>${s}</li>`).join("")}</ol></div>
  <button class="btn g" data-act="smade">I made this</button>`;
}

function List(){
  const ids = Object.keys(S.list);
  if(!ids.length) return `<h1>My list</h1><div class="empty"><b>Your list is empty</b>Open a meal and add what you need.<button class="btn t" data-act="goto" data-tab="meals">See meals</button></div>`;
  const totals = STORES.map(s=>({s, t: ids.reduce((a,id)=>a+ITEM[id].price[s.id]*S.list[id],0)}));
  const best = totals.reduce((a,b)=>b.t<a.t?b:a);
  const mine = totals.find(x=>x.s.id===S.store).t;
  const b = parseFloat(S.budget);
  const budgetLine = isNaN(b) ? "" :
    (b>=mine ? `<div class="budget ok">You'll have ${money(b-mine)} left this month.</div>` : `<div class="budget over">That's ${money(mine-b)} over what you have left.</div>`);
  const items = ids.map(id=>{ const it=ITEM[id]; const n=S.list[id]; const done=S.done.includes(id);
    return `<div class="li ${done?"done":""}"><button class="box" data-act="tick" data-id="${id}" aria-label="Got it">${done?"✓":""}</button>
      <span class="nm">${it.name}<small>${n>1?n+" × ":""}${it.pkg}</small></span>
      <b>${money(it.price[S.store]*n)}</b></div>`; }).join("");
  return `
  <h1>My list</h1>
  <p class="sub">${ids.length} item${ids.length===1?"":"s"}, priced at ${storeName(S.store)}.</p>
  <h2>Compare stores</h2>
  <div class="compare">${totals.map(x=>`<button class="store ${x===best?"best":""}" data-act="setstore" data-s="${x.s.id}"><small>${x.s.name}</small><b>${money(x.t)}</b>${x===best?"<em>Cheapest</em>":""}</button>`).join("")}</div>
  ${budgetLine}
  <div class="card" style="padding:4px 16px;margin-top:16px">${items}</div>
  <button class="btn g" data-act="gotit">Put checked items in my pantry</button>
  <button class="btn o" data-act="clearlist">Clear list</button>
  <p class="foot">Prices are estimates.</p>`;
}

function Find(){
  const links = [
    ["🛒","Stores that take SNAP","USDA store finder","https://www.fns.usda.gov/snap/retailer-locator"],
    ["🥫","Food banks near me","Feeding America","https://www.feedingamerica.org/find-your-local-foodbank"],
    ["🏠","Pantries and free meals","Search by ZIP code","https://www.findhelp.org/"],
    ["📞","Call or text 211","Texas help line for food and more","https://www.211texas.org/"],
    ["💳","My Lone Star Card","Your Texas Benefits","https://www.yourtexasbenefits.com/"]
  ];
  return `
  <h1>Find food</h1>
  <p class="sub">Stores, pantries and help near you.</p>
  ${links.map(([ic,t,s,u])=>`<a class="card link" href="${u}" target="_blank" rel="noopener"><span class="ic">${ic}</span><span><b>${t}</b><span class="hint">${s}</span></span><span class="go">›</span></a>`).join("")}
  <div class="note" style="margin-top:16px"><b>Texas SNAP rule:</b> candy and sweetened drinks can't be bought with SNAP. Every meal in this app uses SNAP eligible food.</div>
  <div class="note" style="margin-top:12px;background:var(--green-l)"><b>Grow your own:</b> SNAP can buy seeds and plants that grow food, such as tomatoes, peppers and herbs.</div>`;
}

/* ---------- RENDER ---------- */
const TABS = [["home","🏠","Home"],["pantry","🥫","Pantry"],["meals","🍲","Meals"],["scratch","🥖","Scratch"],["list","📝","List"],["find","📍","Find"]];
function render(top){
  const y = window.scrollY;
  $("#screen").innerHTML = S.meal ? MealDetail() : S.scratch ? ScratchDetail() : ({home:Home,pantry:Pantry,meals:Meals,scratch:Scratch,list:List,find:Find}[S.tab])();
  $("#nav").innerHTML = TABS.map(([id,i,l])=>`<button class="${S.tab===id?"on":""}" data-act="goto" data-tab="${id}"><span class="i">${i}</span>${l}${id==="list"&&listCount()?`<span class="badge">${listCount()}</span>`:""}</button>`).join("");
  window.scrollTo(0, top?0:y);
  const q=$("#q"); if(q){ q.oninput=e=>{ S.q=e.target.value; const pos=e.target.selectionStart; render(); const n=$("#q"); n.focus(); n.setSelectionRange(pos,pos); }; }
  const bud=$("#budget"); if(bud){ bud.oninput=e=>{ S.budget=e.target.value.replace(/[^0-9.]/g,""); save(); }; }
  const st=$("#store"); if(st){ st.onchange=e=>{ S.store=e.target.value; save(); render(); }; }
  const cu=$("#cuisine"); if(cu){ cu.onchange=e=>{ S.cuisine=e.target.value; save(); render(); }; }
}

document.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="goto") return go(b.dataset.tab);
  if(a==="fam"){ S.family=Math.min(12,Math.max(1,S.family+ +b.dataset.d)); }
  if(a==="toggle"){ const id=b.dataset.id; S.pantry = has(id)?S.pantry.filter(x=>x!==id):[...S.pantry,id]; }
  if(a==="allergy"){ const id=b.dataset.a; S.allergies = S.allergies.includes(id)?S.allergies.filter(x=>x!==id):[...S.allergies,id]; }
  if(a==="noallergy"){ S.allergies=[]; S.asked=true; }
  if(a==="allergydone"){ S.asked=true; if(S.allergies.length) toast("Showing safe meals only"); }
  if(a==="editallergy"){ S.asked=false; save(); return render(true); }
  if(a==="box"){ let n=0; PANTRY_BOX.forEach(id=>{ if(!has(id)){S.pantry.push(id);n++;} }); toast(n?`Added ${n} pantry box items`:"Already in your pantry"); S.tab="pantry"; save(); return render(true); }
  if(a==="clearpantry"){ S.pantry=[]; toast("Pantry cleared"); }
  if(a==="mtype"){ S.mtype=b.dataset.t; }
  if(a==="filter"){ S.filter=b.dataset.f; }
  if(a==="open"){ S.meal=b.dataset.id; save(); return render(true); }
  if(a==="sopen"){ S.scratch=b.dataset.id; save(); return render(true); }
  if(a==="back"){ S.meal=null; S.scratch=null; return render(true); }
  if(a==="addlist"){
    const isS = !!S.scratch;
    const r = isS ? SCRATCH.find(x=>x.id===S.scratch) : RECIPES.find(x=>x.id===S.meal);
    const need = isS ? scratchInfo(r).need : mealInfo(r).need;
    const s = isS ? 1 : k();
    need.forEach(g=>{ const o=pick(g); S.list[o.id]=Math.max(S.list[o.id]||0, pkgs(o,s)); });
    toast("Added to your list");
  }
  if(a==="made"){ const r=RECIPES.find(x=>x.id===S.meal); const used=r.groups.filter(g=>!isBasic(g)&&haveG(g)).map(pick).filter(o=>o.use*k()>=1).map(o=>o.id); S.pantry=S.pantry.filter(id=>!used.includes(id)); toast(used.length?"Nice! Pantry updated":"Nice work!"); S.meal=null; save(); return render(true); }
  if(a==="smade"){ const r=SCRATCH.find(x=>x.id===S.scratch); const i=scratchInfo(r); const used=r.groups.filter(g=>!isBasic(g)&&haveG(g)).map(pick).filter(o=>o.use>=1).map(o=>o.id); S.pantry=S.pantry.filter(id=>!used.includes(id)); if(!has(r.makes)) S.pantry.push(r.makes); S.saved += i.save; toast("You saved "+money(i.save)+"! Added to your pantry"); S.scratch=null; save(); return render(true); }
  if(a==="tick"){ const id=b.dataset.id; S.done = S.done.includes(id)?S.done.filter(x=>x!==id):[...S.done,id]; }
  if(a==="gotit"){ if(!S.done.length) return toast("Check off what you bought"); S.done.forEach(id=>{ if(!has(id)) S.pantry.push(id); delete S.list[id]; }); toast(`${S.done.length} added to your pantry`); S.done=[]; }
  if(a==="clearlist"){ S.list={}; S.done=[]; toast("List cleared"); }
  if(a==="setstore"){ S.store=b.dataset.s; toast("Now pricing at "+storeName(S.store)); }
  save(); render();
});

render(true);
</script>
</body>
</html>
